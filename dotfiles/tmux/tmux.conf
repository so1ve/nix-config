# General
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:extkeys"
set -g allow-passthrough on
set -g base-index 1
set -g pane-base-index 1
set -g status-keys vi
set -g mode-keys vi
set -g mouse on
set -g focus-events on
set -g renumber-windows on
set -g set-clipboard on
set -s escape-time 0
set -g history-limit 100000

# Theme
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#212221,fg=#a8a29e"
set -g status-left-length 30
set -g status-right-length 80
set -g status-left '#[bg=#{?client_prefix,#d4976c,#4d9375},fg=#212221,bold] #S #[bg=#212221,fg=#4a4a4a,nobold] │ '
set -g status-right '#[fg=#4a4a4a]│ #[fg=#959da5]#{pane_current_command}#[fg=#e6cc77,bold]#{?window_zoomed_flag, ZOOM,} '

set -g window-status-separator ""
set -g window-status-format '#[bg=#212221,fg=#6a737d] #I:#W#{?window_flags, #F,} '
set -g window-status-current-format '#[bg=#292929,fg=#4d9375,bold] #I:#W#{?window_flags, #F,} '
set -g window-status-activity-style "bg=#212221,fg=#e6cc77"
set -g window-status-bell-style "bg=#212221,fg=#cb7676,bold"

set -g pane-border-lines single
set -g pane-border-style "fg=#4a4a4a"
set -g pane-active-border-style "fg=#4d9375"
set -g display-panes-colour "#6a737d"
set -g display-panes-active-colour "#4d9375"

set -g message-style "bg=#e6cc77,fg=#212221,bold"
set -g message-command-style "bg=#292929,fg=#dbd7ca"
set -g mode-style "bg=#4d9375,fg=#212221,bold"
set -g clock-mode-colour "#4d9375"
set -g menu-style "bg=#292929,fg=#dbd7ca"
set -g menu-selected-style "bg=#4d9375,fg=#212221,bold"
set -g menu-border-style "fg=#4d9375"
set -g popup-style "bg=#292929,fg=#dbd7ca"
set -g popup-border-style "fg=#4d9375"

# Neovim integration and navigation
bind-key -n C-h if -F "#{@pane-is-vim}" "send-keys C-h" "select-pane -L"
bind-key -n C-j if -F "#{@pane-is-vim}" "send-keys C-j" "select-pane -D"
bind-key -n C-k if -F "#{@pane-is-vim}" "send-keys C-k" "select-pane -U"
bind-key -n C-l if -F "#{@pane-is-vim}" "send-keys C-l" "select-pane -R"

bind-key -n C-Left if -F "#{@pane-is-vim}" "send-keys C-Left" "resize-pane -L 1"
bind-key -n C-Down if -F "#{@pane-is-vim}" "send-keys C-Down" "resize-pane -D 1"
bind-key -n C-Up if -F "#{@pane-is-vim}" "send-keys C-Up" "resize-pane -U 1"
bind-key -n C-Right if -F "#{@pane-is-vim}" "send-keys C-Right" "resize-pane -R 1"

bind-key -n C-M-h select-window -t :-
bind-key -n C-M-l select-window -t :+

bind-key -n C-S-h swap-window -d -t :-
bind-key -n C-S-l swap-window -d -t :+
