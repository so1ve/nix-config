interface:
  display_name: "Review With Me"
  short_description: "Review AI changes with stable diffs and inline feedback"
  default_prompt: "Use $review-with-me to organize these AI-generated changes into semantic review units, preserve each reviewed state, answer my feedback, automatically start and verify the local diff frontend, and give me its working URL. Never ask me to run the server myself."
policy:
  allow_implicit_invocation: true
